<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Empréstimos - Biblioteca</title>

<link rel="stylesheet"
href="../css/style.css">

</head>

<body>

<header>

<div class="logo">
📚 Biblioteca
</div>

<nav>

<a href="../index.html">
Início
</a>

<a href="livros.html">
Livros
</a>

<a href="alunos.html">
Alunos
</a>

<a href="emprestimos.html">
Empréstimos
</a>

</nav>

</header>

<main class="container">

<section class="page">

<h1>Controle de Empréstimos</h1>

<form class="form" id="formEmprestimo">

<label for="alunoEmprestimo">
Aluno
</label>

<input
type="text"
id="alunoEmprestimo"
placeholder="Nome do aluno"
required
>

<label for="livroEmprestimo">
Livro
</label>

<input
type="text"
id="livroEmprestimo"
placeholder="Nome do livro"
required
>

<label for="data">
Data do empréstimo
</label>

<input
type="date"
id="data"
required
>

<button type="submit">
Registrar empréstimo
</button>

</form>

<h2>Empréstimos registrados</h2>

<table>

<thead>

<tr>
<th>Aluno</th>
<th>Livro</th>
<th>Data</th>
</tr>

</thead>

<tbody id="listaEmprestimos">

</tbody>

</table>

</section>

</main>

<footer>

<p>
© 2026 - Sistema Biblioteca
</p>

</footer>

<script src="../js/script.js"></script>

</body>

</html>
