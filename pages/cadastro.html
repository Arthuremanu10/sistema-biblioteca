<main class="container">

<section class="page">

<h1>Cadastrar Usuário</h1>

<form class="form" id="formCadastro">

<label for="usuario">
Nome
</label>

<input
type="text"
id="usuario"
placeholder="Digite seu nome"
required
>

<label for="email">
E-mail
</label>

<input
type="email"
id="email"
placeholder="Digite seu e-mail"
required
>

<label for="senha">
Senha
</label>

<input
type="password"
id="senha"
placeholder="Digite sua senha"
required
>

<button type="submit">
Criar cadastro
</button>

</form>

</section>

</main>

<p>
© 2026 - Sistema Biblioteca
</p>

</footer>
