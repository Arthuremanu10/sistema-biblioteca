<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Livros | Biblioteca</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="header">

<div class="logo">
<span class="logo-icon">▦</span>
<span>Biblioteca</span>
</div>

<nav class="nav">

<a href="../index.html">
Início
</a>

<a href="livros.html" class="active">
Livros
</a>

<a href="alunos.html">
Alunos
</a>

<a href="emprestimos.html">
Empréstimos
</a>

</nav>

<a href="cadastro.html" class="header-button">
Cadastrar
</a>

</header>


<main class="container">

<section class="page">

<div class="page-header">

<div>

<span class="eyebrow">
ACERVO
</span>

<h1>
Livros
</h1>

<p>
Cadastre e organize os livros
disponíveis na biblioteca.
</p>

</div>

</div>


<form class="form" id="formLivro">

<div class="form-group">

<label for="titulo">
Título do livro
</label>

<input
type="text"
id="titulo"
placeholder="Ex.: O Pequeno Príncipe"
required
>

</div>


<div class="form-group">

<label for="autor">
Autor
</label>

<input
type="text"
id="autor"
placeholder="Nome do autor"
required
>

</div>


<div class="form-group">

<label for="ano">
Ano de publicação
</label>

<input
type="number"
id="ano"
placeholder="Ex.: 2020"
required
>

</div>


<button type="submit" class="primary-button">
+ Cadastrar livro
</button>

</form>


<div class="table-container">

<div class="table-header">

<div>

<h2>
Livros cadastrados
</h2>

<p>
Consulte os livros adicionados ao sistema.
</p>

</div>

</div>


<div class="table-scroll">

<table>

<thead>

<tr>
<th>Título</th>
<th>Autor</th>
<th>Ano</th>
</tr>

</thead>

<tbody id="listaLivros">

</tbody>

</table>

</div>

</div>

</section>

</main>


<footer class="footer">

<div class="logo">

<span class="logo-icon">
▦
</span>

Biblioteca

</div>

<p>
© 2026 Sistema Biblioteca
</p>

</footer>


<script src="../js/script.js"></script>

</body>

</html>
