<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Livros - Biblioteca</title>

<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>

<div class="logo">
📚 Biblioteca
</div>

<nav>
<a href="../index.html">Início</a>
<a href="livros.html">Livros</a>
<a href="alunos.html">Alunos</a>
<a href="emprestimos.html">Empréstimos</a>
</nav>

</header>

<main class="container">

<section class="page">

<h1>Cadastro de Livros</h1>

<form class="form" id="formLivro">

<label for="titulo">Título</label>
<input
type="text"
id="titulo"
placeholder="Digite o título do livro"
required
>

<label for="autor">Autor</label>
<input
type="text"
id="autor"
placeholder="Digite o autor"
required
>

<label for="ano">Ano</label>
<input
type="number"
id="ano"
placeholder="Digite o ano"
required
>

<button type="submit">
Cadastrar livro
</button>

</form>

<h2>Livros cadastrados</h2>

<table>

<thead>
<tr>
<th>Título</th>
<th>Autor</th>
<th>Ano</th>
</tr>
</thead>

<tbody id="listaLivros">

</tbody>

</table>

</section>

</main>

<footer>
<p>© 2026 - Sistema Biblioteca</p>
</footer>

<script src="../js/script.js"></script>

</body>
</html>
